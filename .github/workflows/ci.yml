name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送取消旧的在途运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 版本取自 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 检查态：不带 --fix。否则自动修复会以 0 退出，
      # CI 一片绿而仓库里仍是脏的。
      - name: Lint
        run: pnpm lint

      # --continue: 单个包失败时不再中断其余包，避免一个错误掩盖后续错误
      - name: Type-check
        run: pnpm type-check --continue

      # 全部测试走 mock，不需要数据库与任何密钥环境变量
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
